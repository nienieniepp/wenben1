<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>中文摘要系统 Demo</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; max-width: 900px; }
    textarea { width: 100%; height: 220px; }
    .box { background: #f6f8fa; padding: 1rem; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>中文抽象摘要系统（Transformer）</h1>
  <form method="post">
    <label for="text">请输入中文原文：</label><br>
    <textarea name="text" id="text">{{ text }}</textarea><br><br>
    <button type="submit">生成摘要</button>
  </form>

  {% if summary %}
  <h2>生成结果</h2>
  <div class="box">
    <p><strong>摘要：</strong>{{ summary }}</p>
    <p><strong>原文长度：</strong>{{ text_len }}</p>
    <p><strong>摘要长度：</strong>{{ summary_len }}</p>
  </div>
  {% endif %}
</body>
</html>
